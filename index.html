<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/rumuze.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA Theme Colors & iOS Compatibility -->
  <meta name="theme-color" content="#000B18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/rumuze-192.png">

  <title>Rumuze</title>
  <!-- SEO and Social Meta are dynamically injected by Cloudflare Middleware based on language (/ar) -->

  <!-- CRITICAL: High-priority font preloading for LCP optimization -->
  <!-- Inter: Primary Latin font (Hero H1, body text) -->
  <link rel="preload" href="/fonts/inter-v13-latin-regular.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">
  <link rel="preload" href="/fonts/inter-v13-latin-600.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">
  <link rel="preload" href="/fonts/inter-v13-latin-700.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">

  <!-- Cairo: Primary Arabic font -->
  <link rel="preload" href="/fonts/cairo-v28-arabic-regular.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">
  <link rel="preload" href="/fonts/cairo-v28-arabic-700.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">

  <!-- Montserrat: Headings only (lower priority) -->
  <link rel="preload" href="/fonts/montserrat-v26-latin-700.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Preconnect to external image CDN (Unsplash) -->
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

  <link rel="author" href="/humans.txt" />

  <!-- Zero-JS Loading Skeleton for Perfect CLS -->
  <style>
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #000B18 0%, #001529 100%);
    }

    #root:empty::before {
      content: '';
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 229, 255, 0.1);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Explicit Manifest Link for Crawlers -->
  <link rel="manifest" href="/manifest.webmanifest">
</body>

<!-- Explicit Inline Service Worker Registration for PWA Audit Tools -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(registration => {
          console.log('SW registered: ', registration);
        })
        .catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
    });
  }
</script>

</html>
