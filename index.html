  <script>
    (() => {
      const storageKey = 'rumuze-theme';
      const root = document.documentElement;
      let theme = 'light';

      try {
        const savedTheme = localStorage.getItem(storageKey);
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (_) {}

      // Arabic is the primary language; only /en pages are left-to-right. Set
      // this before first paint so the shell does not flip direction.
      if (/^\/en(\/|$)/.test(location.pathname)) {
        root.lang = 'en';
        root.dir = 'ltr';
      }

      root.classList.toggle('dark', theme === 'dark');
      root.dataset.theme = theme;
      root.style.colorScheme = theme;

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute('content', theme === 'dark' ? '#030E09' : '#F5FAF7');
      }
    })();
  </script>
