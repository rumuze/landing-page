name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Unused files, exports and dependencies (config: knip.json).
      - name: Unused code
        run: npm run knip

      # Builds the client and server bundles and prerenders every public route.
      # A route that fails to render, or renders without a title, h1, canonical
      # or JSON-LD, fails the build.
      - name: Build and prerender
        run: npm run build

      # Browser tests against the built site: routing and redirects, the contact
      # form and dialog, crawler-facing HTML on every page, axe accessibility in
      # both languages, and layout on a phone.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
