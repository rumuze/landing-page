name: Live site check

# Compares what the public domain serves with the latest commit on main. A red run
# means the domain is behind (stale hosting, a broken deploy) or answering wrongly.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the live site
        env:
          SITE_URL: https://www.rumuze.com
        run: |
          export EXPECTED_SHA="$(git rev-parse HEAD)"
          export EXPECTED_TIME="$(git log -1 --format=%cI)"
          node scripts/check-live.mjs "$SITE_URL"
